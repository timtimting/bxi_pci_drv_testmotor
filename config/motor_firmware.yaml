# =============================================================================
# 电机统一配置
# =============================================================================
# 电机拓扑：
#   bus0/id1-3  -> 腰部
#   bus1        -> 左腿
#   bus2        -> 右腿
#   bus3        -> 左手
#   bus4        -> 右手
#   bus0/id4-5  -> 头部（逻辑 index 固定放在最后）
#
# 电机字段：
#   index : 上层控制使用的逻辑序号，从 0 开始
#   bus   : CAN 总线编号，范围 0-4
#   id    : 电机在对应 CAN 总线上的 ID
#   type  : 电机型号，用于选择 firmware_files 中的烧录文件

# -----------------------------------------------------------------------------
# 固件存放目录
# -----------------------------------------------------------------------------
firmware_dir: firmware

# -----------------------------------------------------------------------------
# motor_console 运行参数
# -----------------------------------------------------------------------------
# 全部电机回零时，KP 从 0 缓慢增加到 home_kp，KD 保持 home_kd。
home_kp: 20.0
home_kd: 1.0
home_soft_start_ms: 2000

# 上电后的电机扫描及软启动等待时间。
scan_timeout_ms: 1000
power_on_wait_ms: 2000

# MIT 控制帧使用 CAN-FD；实时打印并解析收到的 CAN 帧。
mit_canfd: on
live_output: on

# 终端默认语言：默认中文；zh=中文，en=英文；运行时可用 language 命令切换。
language: zh

# -----------------------------------------------------------------------------
# MIT 协议参数范围
# -----------------------------------------------------------------------------
mit_p_min: -12.5
mit_p_max: 12.5
mit_v_min: -45.0
mit_v_max: 45.0
mit_t_min: -18.0
mit_t_max: 18.0
mit_kp_max: 500.0
mit_kd_max: 5.0

# -----------------------------------------------------------------------------
# 电机型号与固件文件名
# 修改目录或文件名不需要重新编译程序。
# -----------------------------------------------------------------------------
firmware_files:
  50: bxi_motor_50.bin
  50L: bxi_motor_50L.bin
  70: bxi_motor_70.bin
  85: bxi_motor_85.bin

# =============================================================================
# 电机拓扑
# =============================================================================
motors:
  # ---------------------------------------------------------------------------
  # 腰部：bus0 / id1-id3，逻辑 index 0-2
  # ---------------------------------------------------------------------------
  - index: 0
    bus: 0
    id: 1
    type: "70"
  - index: 1
    bus: 0
    id: 2
    type: "70"
  - index: 2
    bus: 0
    id: 3
    type: "85"

  # ---------------------------------------------------------------------------
  # 左腿：bus1，逻辑 index 3-8
  # ---------------------------------------------------------------------------
  - index: 3
    bus: 1
    id: 1
    type: "85"
  - index: 4
    bus: 1
    id: 2
    type: "85"
  - index: 5
    bus: 1
    id: 3
    type: "70"
  - index: 6
    bus: 1
    id: 4
    type: "85"
  - index: 7
    bus: 1
    id: 5
    type: "50L"
  - index: 8
    bus: 1
    id: 6
    type: "50L"

  # ---------------------------------------------------------------------------
  # 右腿：bus2，逻辑 index 9-14
  # ---------------------------------------------------------------------------
  - index: 9
    bus: 2
    id: 1
    type: "85"
  - index: 10
    bus: 2
    id: 2
    type: "85"
  - index: 11
    bus: 2
    id: 3
    type: "70"
  - index: 12
    bus: 2
    id: 4
    type: "85"
  - index: 13
    bus: 2
    id: 5
    type: "50L"
  - index: 14
    bus: 2
    id: 6
    type: "50L"

  # ---------------------------------------------------------------------------
  # 左手：bus3，逻辑 index 15-21
  # ---------------------------------------------------------------------------
  - index: 15
    bus: 3
    id: 1
    type: "70"
  - index: 16
    bus: 3
    id: 2
    type: "70"
  - index: 17
    bus: 3
    id: 3
    type: "50"
  - index: 18
    bus: 3
    id: 4
    type: "70"
  - index: 19
    bus: 3
    id: 5
    type: "50"
  - index: 20
    bus: 3
    id: 6
    type: "50"
  - index: 21
    bus: 3
    id: 7
    type: "50"

  # ---------------------------------------------------------------------------
  # 右手：bus4，逻辑 index 22-28
  # ---------------------------------------------------------------------------
  - index: 22
    bus: 4
    id: 1
    type: "70"
  - index: 23
    bus: 4
    id: 2
    type: "70"
  - index: 24
    bus: 4
    id: 3
    type: "50"
  - index: 25
    bus: 4
    id: 4
    type: "70"
  - index: 26
    bus: 4
    id: 5
    type: "50"
  - index: 27
    bus: 4
    id: 6
    type: "50"
  - index: 28
    bus: 4
    id: 7
    type: "50"

  # ---------------------------------------------------------------------------
  # 头部：bus0 / id4-id5，逻辑 index 29-30
  # 这两台电机有意放在整个逻辑序号列表的最后。
  # ---------------------------------------------------------------------------
  - index: 29
    bus: 0
    id: 4
    type: "50"
  - index: 30
    bus: 0
    id: 5
    type: "50"
