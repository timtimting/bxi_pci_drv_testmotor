# =============================================================================
# motor_console 终端配置
# =============================================================================
# 本文件只放终端运行参数、电机状态识别和 MIT 型号参数。
# 电机 index/bus/id/version 拓扑放在 config/flash_plan_default.yaml。

# -----------------------------------------------------------------------------
# motor_console 运行参数
# -----------------------------------------------------------------------------
# 可选远程固件下载站。留空时只使用本地 firmware_dir。
# firmware_sync_on_start 暂时关闭网页同步；需要恢复时改为 on。
# 程序启动时会尝试从下载站拉取默认烧录计划所需固件到 firmware_cache_dir。
# 全部拉取成功：本次运行烧录优先使用 firmware_cache_dir；任意失败：回退 firmware_dir。
firmware_sync_on_start: off
firmware_base_url: ""
firmware_cache_dir: firmware_cache

# 全部电机回零时，KP 从 0 缓慢增加到目标 KP，KD 保持目标 KD。
# 默认使用 home_kp/home_kd；如果 home_kp_list/home_kd_list 中存在对应 index，
# stand_up 会优先使用数组值。数组顺序与电机 index 一一对应，从 00 开始。
home_kp: 20.0
home_kd: 1.0
home_kp_list: [500, 500, 300, 300, 100, 100, 300, 50, 50, 300, 100, 100, 300, 50, 50, 100, 80, 80, 100, 20, 20, 20, 100, 80, 80, 100, 20, 20, 20]
home_kd_list: [3, 3, 3, 2.5, 2, 2, 2.5, 2, 2, 2.5, 2, 2, 2.5, 2, 2, 2.5, 2, 2, 2.5, 1, 1, 1, 2.5, 2, 2, 2.5, 1, 1, 1]
home_soft_start_ms: 2000

# 上电后的电机扫描及软启动等待时间。
scan_timeout_ms: 1000
power_on_wait_ms: 2000

# 上电后只向已确认在线电机发送零 MIT 帧，用成功 ACK 让 CAN TX error 逐步恢复。
# 如果上下电后仍残留少量 can[x] tx error cnt，可适当增大 can_warmup_count。
can_warmup_count: 260
can_warmup_period_ms: 10

# 电机输出状态识别关键字。后续如果固件输出变化，可只改这里。
state_boot_pattern: boot...
state_motor_pattern: stm run
state_no_app_pattern: no useful app
state_boot_menu_pattern: Boot menu:
state_motor_menu_pattern: Motor main menu:

# MIT 控制帧使用 CAN-FD；实时打印并解析收到的 CAN 帧。
mit_canfd: on
live_output: on

# 终端默认语言：默认中文；zh=中文，en=英文；运行时可用 language 命令切换。
language: zh

# -----------------------------------------------------------------------------
# MIT 协议默认参数范围
# -----------------------------------------------------------------------------
# p_des/v_des/Kp 对当前 50/50L/70/85 型号通用；Kd/t_ff 按型号覆盖。
# 如果某个电机型号没有写在 motor_types 中，会回退使用这里的默认范围。
mit_p_min: -12.5
mit_p_max: 12.5
mit_v_min: -45.0
mit_v_max: 45.0
mit_t_min: -40.0
mit_t_max: 40.0
mit_kp_max: 500.0
mit_kd_max: 5.0

# -----------------------------------------------------------------------------
# 电机型号配置
# 每个型号独立配置：
#   firmware : 该型号对应的固件文件名；启动预拉取和烧录都会使用这个名字
#   mit_*    : 该型号的 MIT 打包/解包范围
#
# 目前主要使用 50、50L、70、85 四个型号：
#   50/50L/70 的 Kd 范围 [0,5]
#   85 的 Kd 范围 [0,20]
#   50/50L 的 t_ff 范围 [-40,40]
#   70 的 t_ff 范围 [-80,80]
#   85 的 t_ff 范围 [-160,160]
# -----------------------------------------------------------------------------
motor_types:
  - type: "50"
    firmware: bxi_motor_50.bin
    mit_p_min: -12.5
    mit_p_max: 12.5
    mit_v_min: -45.0
    mit_v_max: 45.0
    mit_t_min: -40.0
    mit_t_max: 40.0
    mit_kp_max: 500.0
    mit_kd_max: 5.0
  - type: "50L"
    firmware: bxi_motor_50L.bin
    mit_p_min: -12.5
    mit_p_max: 12.5
    mit_v_min: -45.0
    mit_v_max: 45.0
    mit_t_min: -40.0
    mit_t_max: 40.0
    mit_kp_max: 500.0
    mit_kd_max: 5.0
  - type: "70"
    firmware: bxi_motor_70.bin
    mit_p_min: -12.5
    mit_p_max: 12.5
    mit_v_min: -45.0
    mit_v_max: 45.0
    mit_t_min: -80.0
    mit_t_max: 80.0
    mit_kp_max: 500.0
    mit_kd_max: 5.0
  - type: "85"
    firmware: bxi_motor_85.bin
    mit_p_min: -12.5
    mit_p_max: 12.5
    mit_v_min: -45.0
    mit_v_max: 45.0
    mit_t_min: -160.0
    mit_t_max: 160.0
    mit_kp_max: 500.0
    mit_kd_max: 20.0
