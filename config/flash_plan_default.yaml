# =============================================================================
# 默认电机烧录配置
# =============================================================================
# 这个文件只描述“默认要烧录哪些电机，以及烧录哪个程序版本”。
# 终端语言、电机状态识别、MIT 参数、电机型号等配置放在：
#   config/motor_console.yaml
#
# 使用方式：
#   power_on
#   mit_disable_all
#   flash_plan config/flash_plan_default.yaml

# 固件目录；version 会优先在该目录下查找。
# 例如 version: 50L 会尝试 firmware/bxi_motor_50L.bin。
firmware_dir: firmware

# 可选远程固件下载站。留空时只使用本地固件。
# 程序启动时会尝试从下载站拉取默认烧录计划所需固件到 firmware_cache_dir。
# 全部拉取成功：本次运行烧录优先使用 firmware_cache_dir；任意失败：回退 firmware_dir。
# 例如 version: 50L 会根据 config/motor_console.yaml 中 motor_types.firmware 下载：
#   ${firmware_base_url}/<firmware>
firmware_base_url: ""
firmware_cache_dir: firmware_cache

targets:
  # 腰部：bus0 / id1-id3，逻辑 index 00-02
  - index: 0
    bus: 0
    id: 1
    version: 70
    name: 腰部左边
  - index: 1
    bus: 0
    id: 2
    version: 70
    name: 腰部右边
  - index: 2
    bus: 0
    id: 3
    version: 85
    name: 腰部yaw、z轴

  # 左腿：bus1，逻辑 index 03-08
